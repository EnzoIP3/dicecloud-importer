<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">DiceCloud Character Importer workflow</title>
  <desc id="desc">A flowchart showing a public DiceCloud character becoming a Markdown note, a focused Fantasy Statblock, and an Initiative Tracker entry.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141827"/>
      <stop offset="1" stop-color="#241c38"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b7bbd"/>
    </marker>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .title { fill: #f8f7ff; font-size: 25px; font-weight: 750; }
      .label { fill: #f8f7ff; font-size: 16px; font-weight: 700; }
      .small { fill: #b5b8cf; font-size: 12px; }
      .number { fill: #c4b5fd; font-size: 13px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1400" height="430" rx="24" fill="url(#background)"/>
  <text x="56" y="62" class="ui title">From DiceCloud sheet to combat-ready campaign note</text>
  <text x="56" y="89" class="ui small">Public, read-only import · no credentials · no writes back to DiceCloud</text>

  <g filter="url(#shadow)">
    <rect x="56" y="145" width="220" height="150" rx="16" fill="#20263a" stroke="#4c5578"/>
    <rect x="300" y="145" width="220" height="150" rx="16" fill="#20263a" stroke="#4c5578"/>
    <rect x="544" y="145" width="220" height="150" rx="16" fill="#28233f" stroke="#6b52a8"/>
    <rect x="788" y="145" width="220" height="150" rx="16" fill="#20263a" stroke="#4c5578"/>
    <rect x="1032" y="145" width="312" height="150" rx="16" fill="#20263a" stroke="#4c5578"/>
  </g>

  <g class="ui">
    <text x="78" y="178" class="number">01</text>
    <text x="78" y="213" class="label">DiceCloud v2</text>
    <text x="78" y="242" class="small">Public character URL</text>
    <text x="78" y="264" class="small">Calculated variables</text>
    <text x="78" y="286" class="small">Properties and resources</text>

    <text x="322" y="178" class="number">02</text>
    <text x="322" y="213" class="label">REST import</text>
    <text x="322" y="242" class="small">GET /api/creature/{id}</text>
    <text x="322" y="264" class="small">Local normalizer</text>
    <text x="322" y="286" class="small">No account required</text>

    <text x="566" y="178" class="number">03</text>
    <text x="566" y="213" class="label">Markdown note</text>
    <text x="566" y="242" class="small">Readable character page</text>
    <text x="566" y="264" class="small">Extended data sections</text>
    <text x="566" y="286" class="small">Refreshable and linkable</text>

    <text x="810" y="178" class="number">04</text>
    <text x="810" y="213" class="label">Combat view</text>
    <text x="810" y="242" class="small">Focused statblock</text>
    <text x="810" y="264" class="small">HP · AC · initiative</text>
    <text x="810" y="286" class="small">Abilities and saves</text>

    <text x="1054" y="178" class="number">05</text>
    <text x="1054" y="213" class="label">Initiative Tracker</text>
    <text x="1054" y="242" class="small">Add the player to an active encounter</text>
    <text x="1054" y="264" class="small">Track HP, turns and conditions</text>
    <text x="1054" y="286" class="small">Keep the source note untouched</text>
  </g>

  <g stroke="#8b7bbd" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M278 220 H294"/>
    <path d="M522 220 H538"/>
    <path d="M766 220 H782"/>
    <path d="M1010 220 H1026"/>
  </g>
  <rect x="56" y="350" width="1288" height="2" fill="url(#purple)" opacity=".6"/>
  <text x="56" y="382" class="ui small">Fantasy Statblocks is the glanceable combat projection.</text>
  <text x="1344" y="382" text-anchor="end" class="ui small">The Markdown note remains the detailed reference.</text>
</svg>
